[package]
name = "rust_wots"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "rust_wots"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[build-dependencies]
cc = "1.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
